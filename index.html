<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="찰나">
<title>보미의 찰나</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#faf8f5; --surface:#ffffff; --ink:#1b1a18; --sub:#8a857d; --line:#ece8e1;
  --accent:#d9653b; --accent-soft:#fbe9e1; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --serif:"Gowun Batang",ui-serif,serif; --sans:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141414;--surface:#1e1e1d;--ink:#eeebe6;--sub:#8f8a83;--line:#2c2b29;--accent:#f08a5d;--accent-soft:#3a2720;--shadow:none}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:28px 20px 80px}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
h1{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.count{font-size:13px;color:var(--sub)}

/* composer */
.composer{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px 18px 12px;position:relative}
.reply-to{display:none;font-size:13px;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
.reply-to.on{display:flex;gap:8px;align-items:flex-start}
.reply-to p{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.reply-to button{color:var(--sub);font-size:16px;line-height:1}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.75;min-height:110px}
textarea::placeholder{color:var(--sub);opacity:.7}
.c-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.hint{font-size:12px;color:var(--sub)}
.save{background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;transition:opacity .15s}
.save:disabled{opacity:.25;cursor:default}

/* echo card */
.echo{display:none;margin-top:14px;background:var(--accent-soft);border-radius:16px;padding:14px 16px;animation:rise .35s ease}
.echo.on{display:block}
.echo h3{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between}
.echo h3 button{color:var(--accent);opacity:.7;font-size:15px}
.echo .mini{display:block;width:100%;text-align:left;padding:8px 0;border-top:1px solid rgba(0,0,0,.06)}
.echo .mini:first-of-type{border-top:0}
.mini .t{font-family:var(--serif);font-size:15px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini .w{font-size:12px;color:var(--sub);margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tools */
.tools{display:flex;gap:8px;margin:30px 0 14px;align-items:center}
.search{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;color:var(--ink);outline:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;width:100%;transition:transform .12s}
.card:active{transform:scale(.99)}
.card .t{font-family:var(--serif);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.card .m{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.card .m .k{color:var(--accent)}
.tag{color:var(--accent)}
.lnk{color:var(--accent);text-decoration:none;background:var(--accent-soft);border-radius:6px;padding:1px 6px;font-family:var(--sans);font-size:.82em;white-space:nowrap;max-width:100%;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
.c-left{display:flex;align-items:center;gap:10px;min-width:0}
.attach{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.card{cursor:pointer}
.empty{text-align:center;color:var(--sub);font-size:14px;line-height:1.8;padding:50px 0;font-family:var(--serif)}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11;padding:10px 20px calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet-in{max-width:620px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.s-when{font-size:13px;color:var(--sub);margin-bottom:10px}
.s-text{font-family:var(--serif);font-size:19px;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.s-edit{width:100%;font-family:var(--serif);font-size:19px;line-height:1.85;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);outline:0;resize:vertical;min-height:160px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.act{font-size:14px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.danger{color:#c4402f}
.sec{margin-top:24px}
.sec h4{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:8px}
.sec .mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left}
.sec .mini .body{flex:1;min-width:0}
.unlink{color:var(--sub);font-size:13px;padding:2px 4px}
.picker-list{max-height:40vh;overflow:auto;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;color:var(--sub);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.map-box{position:relative;height:min(68vh,620px);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;touch-action:none}
#mapCanvas{width:100%;height:100%;display:block;cursor:grab}
#mapCanvas.dragging{cursor:grabbing}
.map-empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);color:var(--sub);font-size:15px;line-height:1.8;pointer-events:none}
.map-empty.on{display:flex}
.map-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.map-zoom button{width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:17px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-top:12px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.legend i.lg-dash{border-top:2px dashed var(--sub)}
.store-note{font-size:12px;color:var(--sub);text-align:center;margin-top:36px}
.backup{display:none;justify-content:center;gap:8px;font-size:12px;color:var(--sub);margin-top:8px}
.backup.on{display:flex}
.backup button,.backup label{color:var(--sub);text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>보미의 찰나<span>.</span></h1>
    <div class="count" id="count"></div>
  </header>

  <nav class="seg" id="seg">
    <button data-view="list" class="on">찰나</button>
    <button data-view="map">생각 지도</button>
  </nav>

  <div id="listView">
  <section class="composer">
    <div class="reply-to" id="replyTo"><p id="replyText"></p><button id="replyX" aria-label="이어쓰기 취소">×</button></div>
    <textarea id="input" placeholder="지금 떠오른 생각" rows="4"></textarea>
    <div class="c-foot">
      <div class="c-left"><button class="attach" id="pasteLink" type="button">🔗 링크</button><span class="hint" id="hint">#태그를 붙이면 묶여요</span></div>
      <button class="save" id="save" disabled>남기기</button>
    </div>
  </section>

  <section class="echo" id="echo">
    <h3><span>예전에도 이런 생각을 했어요</span><button id="echoX" aria-label="닫기">×</button></h3>
    <div id="echoList"></div>
  </section>

  <div class="tools"><input class="search" id="search" type="search" placeholder="찰나 찾기"></div>
  <div class="tags" id="tags"></div>
  <div class="feed" id="feed"></div>
  </div>

  <div id="mapView" hidden>
    <div class="map-box" id="mapBox">
      <canvas id="mapCanvas"></canvas>
      <div class="map-empty" id="mapEmpty">찰나가 몇 개 더 쌓이면<br>생각들이 이어지기 시작해요</div>
      <div class="map-zoom"><button id="zoomIn" aria-label="확대">+</button><button id="zoomOut" aria-label="축소">−</button><button id="zoomFit" aria-label="전체 보기">⤢</button></div>
    </div>
    <div class="legend">
      <span><i class="lg-solid"></i>엮은 생각</span>
      <span><i class="lg-dash"></i>닮은 생각</span>
      <span>점이 클수록 자주 찾아온 생각 · 흐릴수록 오래된 생각</span>
    </div>
  </div>
  <p class="store-note" id="storeNote"></p>
  <div class="backup" id="backup">
    <button id="exportBtn">백업 파일로 내보내기</button>
    <span>·</span>
    <label>백업 불러오기<input type="file" id="importFile" accept="application/json,.json" hidden></label>
  </div>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"><div class="sheet-in"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ---------- state ---------- */
let items = [];           // {id,text,createdAt,updatedAt,links:[],tags:[]}
let store = null;         // storage adapter
let replyTo = null;
let activeTag = null;
let query = "";
let openId = null;

/* ---------- storage: db (claude.ai) with localStorage fallback ---------- */
const LS_KEY = "chalna.items.v1";
const lsStore = {
  kind: "local",
  start(onChange) {
    try { items = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { items = []; }
    this.onChange = onChange; onChange();
  },
  persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch {} },
  async put(it) { const i = items.findIndex(x => x.id === it.id); if (i >= 0) items[i] = it; else items.push(it); this.persist(); this.onChange(); },
  async remove(id) { items = items.filter(x => x.id !== id); this.persist(); this.onChange(); }
};

function dbStore(db, uid) {
  const col = db.collection("data/users/" + uid);
  return {
    kind: "db",
    start(onChange) {
      col.orderBy("createdAt", "desc").limit(1000).onSnapshot(snap => {
        items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        onChange();
      }, () => toast("저장소 연결이 끊겼어요. 새로고침해 주세요"));
    },
    async put(it) { const { id, ...body } = it; await col.doc(id).set(body); },
    async remove(id) { await col.doc(id).delete(); }
  };
}

async function initStore() {
  let chosen = lsStore;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) chosen = dbStore(db, uid);
    }
  } catch {}
  store = chosen;
  $("storeNote").textContent = store.kind === "db"
    ? "찰나는 보미만 볼 수 있는 개인 공간에 저장돼요"
    : "이 기기에만 저장돼요. 가끔 백업 파일로 내보내 두세요";
  $("backup").classList.toggle("on", store.kind === "local");
  store.start(render);
}

/* ---------- backup (device storage only) ---------- */
$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ app: "ksana", version: 1, exportedAt: Date.now(), items }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `ksana-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = Array.isArray(data) ? data : data.items;
    if (!Array.isArray(incoming)) throw 0;
    let added = 0;
    for (const it of incoming) {
      if (!it || !it.id || typeof it.text !== "string" || byId(it.id)) continue;
      await store.put({ id: it.id, text: it.text, createdAt: it.createdAt || Date.now(), updatedAt: it.updatedAt || it.createdAt || Date.now(), tags: it.tags || parseTags(it.text), links: it.links || [] });
      added++;
    }
    toast(added ? `찰나 ${added}개를 불러왔어요` : "새로 불러올 찰나가 없어요");
  } catch { toast("백업 파일을 읽지 못했어요"); }
});

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byId = id => items.find(x => x.id === id);
const parseTags = t => [...new Set([...t.replace(/https?:\/\/\S+/g, " ").matchAll(/(?:^|\s)#([^\s#.,!?]+)/g)].map(m => m[1]))];
function when(ms) {
  const d = new Date(ms), h = d.getHours();
  const part = h < 5 ? "새벽" : h < 11 ? "아침" : h < 17 ? "낮" : h < 21 ? "저녁" : "밤";
  const now = new Date();
  const sameY = d.getFullYear() === now.getFullYear();
  return `${sameY ? "" : d.getFullYear() + "년 "}${d.getMonth() + 1}월 ${d.getDate()}일 ${part}의 찰나`;
}
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return when(ms);
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

/* text with clickable links and highlighted #tags */
const TOKEN_RE = /(https?:\/\/[^\s<>"'`]*[^\s<>"'`.,!?)\]」』”’])|(#[^\s#.,!?]+)/g;
function shortUrl(u) {
  try {
    const x = new URL(u);
    let rest = (x.pathname + x.search).replace(/\/$/, "");
    if (rest.length > 18) rest = rest.slice(0, 16) + "…";
    return x.hostname.replace(/^www\./, "") + rest;
  } catch { return u; }
}
function richText(node, text) {
  node.textContent = "";
  let last = 0, m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text))) {
    if (m[2] && m.index > 0 && !/\s/.test(text[m.index - 1])) continue; // '#'이 단어 중간이면 태그 아님
    node.append(text.slice(last, m.index));
    if (m[1]) {
      const a = el("a", "lnk", "🔗 " + shortUrl(m[1]));
      a.href = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; a.title = m[1];
      a.addEventListener("click", e => e.stopPropagation());
      node.append(a);
    } else node.append(el("span", "tag", m[0]));
    last = m.index + m[0].length;
  }
  node.append(text.slice(last));
}
const urlsIn = t => t.match(/https?:\/\/[^\s<>"'`]+/g) || [];

/* ---------- similarity (character bigrams, cosine) ---------- */
function grams(t) {
  const s = t.replace(/https?:\/\/\S+/g, " ").replace(/#[^\s]+/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").toLowerCase().trim();
  const m = new Map();
  for (const w of s.split(" ")) {
    if (!w) continue;
    if (w.length === 1) { m.set(w, (m.get(w) || 0) + 1); continue; }
    for (let i = 0; i < w.length - 1; i++) { const g = w.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); }
  }
  return m;
}
const gramCache = new Map();
function gramsOf(x) { const c = gramCache.get(x.id); if (c && c.t === x.text) return c.g; const g = grams(x.text); gramCache.set(x.id, { t: x.text, g }); return g; }
// 여러 찰나에 흔히 나오는 말(~싶다, ~하다 등)은 가볍게, 드문 말은 무겁게 쳐요
let IDF = new Map();
const wOf = k => IDF.size ? (IDF.get(k) ?? 1.5) : 1;
function updateIdf() {
  const df = new Map(), N = items.length;
  for (const x of items) for (const k of gramsOf(x).keys()) df.set(k, (df.get(k) || 0) + 1);
  IDF = new Map();
  for (const [k, d] of df) IDF.set(k, d < 2 ? 1.5 : Math.max(0, Math.log((N + 1) / (d + .5))) / Math.log(N + 1) * 1.5);
}
function cos(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (const [k, v] of a) { const w = wOf(k) * v; na += w * w; if (b.has(k)) dot += w * b.get(k) * wOf(k); }
  for (const [k, v] of b) { const w = wOf(k) * v; nb += w * w; }
  return na && nb ? dot / Math.sqrt(na * nb) : 0;
}
function similar(target, n = 3, minScore = 0.18) {
  const g = gramsOf(target);
  return items
    .filter(x => x.id !== target.id && !(target.links || []).includes(x.id))
    .map(x => ({ x, s: cos(g, grams(x.text)) + ((x.tags || []).some(t => (target.tags || []).includes(t)) ? 0.15 : 0) }))
    .filter(r => r.s >= minScore)
    .sort((a, b) => b.s - a.s).slice(0, n).map(r => r.x);
}

/* ---------- composer ---------- */
const input = $("input"), saveBtn = $("save");
try { input.value = localStorage.getItem("chalna.draft") || ""; } catch {}
function autosize() { input.style.height = "auto"; input.style.height = Math.max(110, input.scrollHeight) + "px"; }
input.addEventListener("input", () => {
  saveBtn.disabled = !input.value.trim();
  autosize();
  try { localStorage.setItem("chalna.draft", input.value); } catch {}
});

/* 링크 붙여넣기: 클립보드의 링크를 커서 위치에 넣어요 */
function insertAtCursor(str) {
  const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
  const before = input.value.slice(0, s), after = input.value.slice(e);
  const pre = before && !/\s$/.test(before) ? " " : "";
  const post = after && !/^\s/.test(after) ? " " : (after ? "" : " ");
  input.value = before + pre + str + post + after;
  const pos = (before + pre + str + post).length;
  input.focus(); input.setSelectionRange(pos, pos);
  input.dispatchEvent(new Event("input"));
}
$("pasteLink").addEventListener("click", async () => {
  let clip = "";
  try { clip = (await navigator.clipboard.readText()).trim(); } catch {}
  const url = (clip.match(/https?:\/\/\S+/) || [])[0];
  if (url) { insertAtCursor(url); toast("링크를 붙였어요"); }
  else { input.focus(); toast(clip ? "복사한 내용에 링크가 없어요" : "링크를 복사한 뒤 눌러 주세요"); }

$("replyX").addEventListener("click", () => setReply(null));

function setReply(it) {

async function save() {
  const text = input.value.trim();
  if (!text || !store) return;
  saveBtn.disabled = true;
  const now = Date.now();
  const it = { id: uid(), text, createdAt: now, updatedAt: now, tags: parseTags(text), links: replyTo ? [replyTo] : [] };
  try {
    await store.put(it);
    if (replyTo) { const p = byId(replyTo); if (p) await store.put({ ...p, links: [...new Set([...(p.links || []), it.id])] }); }
  } catch (e) { saveBtn.disabled = false; toast("저장하지 못했어요. 다시 눌러 주세요"); return; }
  input.value = ""; autosize();
  try { localStorage.removeItem("chalna.draft"); } catch {}
  setReply(null);
  toast("찰나를 남겼어요");

}

function showEcho(it) {
  const old = similar(it, 2).filter(x => it.createdAt - x.createdAt > 60 * 1000);
  const box = $("echo"), list = $("echoList");
  list.textContent = "";
  if (!old.length) { box.classList.remove("on"); return; }

/* ---------- feed ---------- */
$("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderFeed(); });

function render() {
  items.sort((a, b) => b.createdAt - a.createdAt);

  $("count").textContent = items.length ? `${items.length}개의 찰나` : "";

function renderTags() {

  items.forEach(x => (x.tags || []).forEach(t => cnt.set(t, (cnt.get(t) || 0) + 1)));
  const box = $("tags"); box.textContent = "";

    const c = el("button", "chip" + (t === activeTag ? " on" : ""), `#${t} ${n}`);
    c.addEventListener("click", () => { activeTag = activeTag === t ? null : t; renderTags(); renderFeed(); });

}

function renderFeed() {
  const feed = $("feed"); feed.textContent = "";

/* ---------- sheet ---------- */
let sheetMode = "view"; // view | edit | pick | confirm
$("dim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openSheet(id) { openId = id; sheetMode = "view"; renderSheet(); $("dim").classList.add("on"); $("sheet").classList.add("on"); $("sheet").scrollTop = 0; }
function closeSheet() { openId = null; $("dim").classList.remove("on"); $("sheet").classList.remove("on"); }

function miniRow(x, opts = {}) {
  const row = el("div", "mini");
  const body = el("button", "body");
  body.style.textAlign = "left";
  body.append(el("div", "t", x.text), el("div", "w", when(x.createdAt)));
  body.addEventListener("click", opts.onPick || (() => openSheet(x.id)));
  row.append(body);
  if (opts.onUnlink) { const u = el("button", "unlink", "풀기"); u.addEventListener("click", opts.onUnlink); row.append(u); }

}

async function link(a, b) {
  const A = byId(a), B = byId(b); if (!A || !B) return;
  await store.put({ ...A, links: [...new Set([...(A.links || []), b])] });
  await store.put({ ...byId(b), links: [...new Set([...(byId(b).links || []), a])] });
}
async function unlink(a, b) {
  const A = byId(a), B = byId(b);
  if (A) await store.put({ ...A, links: (A.links || []).filter(x => x !== b) });
  if (B) await store.put({ ...byId(b), links: (byId(b).links || []).filter(x => x !== a) });
}

function renderSheet() {
  const x = byId(openId); if (!x) return;
  const body = $("sheetBody"); body.textContent = "";
  body.append(el("div", "s-when", when(x.createdAt) + (x.updatedAt && x.updatedAt - x.createdAt > 60000 ? " · 고쳐 씀" : "")));

  if (sheetMode === "edit") {
    const ta = el("textarea", "s-edit"); ta.value = x.text; body.append(ta);
    const acts = el("div", "actions");
    const ok = el("button", "act primary", "저장");
    ok.addEventListener("click", async () => {
      const t = ta.value.trim(); if (!t) return;
      await store.put({ ...x, text: t, tags: parseTags(t), updatedAt: Date.now() });
      sheetMode = "view"; renderSheet();
    });
    const cancel = el("button", "act", "취소"); cancel.addEventListener("click", () => { sheetMode = "view"; renderSheet(); });
    acts.append(ok, cancel); body.append(acts);
    setTimeout(() => ta.focus(), 50);
    return;
  }

  const t = el("div", "s-text"); richText(t, x.text); body.append(t);

  const acts = el("div", "actions");
  const cont = el("button", "act primary", "이어 쓰기");
  cont.addEventListener("click", () => { closeSheet(); setReply(x); window.scrollTo({ top: 0, behavior: "smooth" }); });
  const weave = el("button", "act", "다른 찰나와 엮기");
  weave.addEventListener("click", () => { sheetMode = sheetMode === "pick" ? "view" : "pick"; renderSheet(); });
  const edit = el("button", "act", "고치기");
  edit.addEventListener("click", () => { sheetMode = "edit"; renderSheet(); });
  const del = el("button", "act danger", sheetMode === "confirm" ? "정말 지울까요?" : "지우기");

    if (sheetMode !== "confirm") { sheetMode = "confirm"; renderSheet(); return; }

  });
  acts.append(cont, weave, edit, del); body.append(acts);

  if (sheetMode === "pick") {
    const sec = el("div", "sec");
    sec.append(el("h4", null, "어떤 찰나와 엮을까요?"));
    const s = el("input", "search"); s.placeholder = "찾기"; s.type = "search"; s.style.width = "100%";
    const list = el("div", "picker-list");
    const candidates = () => items.filter(y => y.id !== x.id && !(x.links || []).includes(y.id));
    const fill = () => {
      list.textContent = "";
      const q = s.value.trim().toLowerCase();
      const c = candidates().filter(y => !q || y.text.toLowerCase().includes(q)).slice(0, 50);
      if (!c.length) list.append(el("p", "hint", "엮을 수 있는 찰나가 없어요"));
      c.forEach(y => list.append(miniRow(y, { onPick: async () => { await link(x.id, y.id); sheetMode = "view"; renderSheet(); toast("엮었어요"); } })));
    };

    sec.append(s, list); body.append(sec);

  const linked = (x.links || []).map(byId).filter(Boolean).sort((a, b) => a.createdAt - b.createdAt);
  if (linked.length) {
    const sec = el("div", "sec");
    sec.append(el("h4", null, "엮인 찰나"));

    sec.append(el("h4", null, "닮은 찰나"));
    sim.forEach(y => {
      const r = miniRow(y);
      const l = el("button", "unlink", "엮기");
      l.addEventListener("click", async () => { await link(x.id, y.id); renderSheet(); toast("엮었어요"); });
      r.append(l); sec.append(r);
    });
    body.append(sec);
  }
}

/* ---------- 생각 지도 ---------- */
let view = "list";
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
function setView(v) {
  view = v;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("listView").hidden = v !== "list";
  $("mapView").hidden = v !== "map";
  if (v === "map") { mapResize(); mapRefresh(true); }
}

const cv = $("mapCanvas"), ctx = cv.getContext("2d");

let nodes = [], edges = [], cam = { x: 0, y: 0, k: 1 }, W = 0, H = 0, alpha = 0, raf = 0;

function mapResize() {
  const r = $("mapBox").getBoundingClientRect(), d = window.devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", () => { if (view === "map") { mapResize(); draw(); } });

function buildGraph() {
  const ids = new Set(items.map(x => x.id));
  const key = (a, b) => a < b ? a + "|" + b : b + "|" + a;
  const em = new Map();
  for (const x of items) for (const l of x.links || []) if (ids.has(l)) em.set(key(x.id, l), { a: x.id, b: l, kind: "link" });
  // 닮은 생각: 각 찰나마다 가장 닮은 찰나 최대 3개
  const gs = items.map(gramsOf);
  for (let i = 0; i < items.length; i++) {
    const cand = [];
    for (let j = 0; j < items.length; j++) {
      if (i === j) continue;
      let sc = cos(gs[i], gs[j]);
      if ((items[i].tags || []).some(t => (items[j].tags || []).includes(t))) sc += 0.15;
      if (sc >= 0.22) cand.push([j, sc]);
    }
    cand.sort((a, b) => b[1] - a[1]).slice(0, 3).forEach(([j, sc]) => {
      const k = key(items[i].id, items[j].id);
      if (!em.has(k)) em.set(k, { a: items[i].id, b: items[j].id, kind: "sim", w: sc });
    });
  }
  edges = [...em.values()];
  const deg = new Map();
  edges.forEach(e => { deg.set(e.a, (deg.get(e.a) || 0) + 1); deg.set(e.b, (deg.get(e.b) || 0) + 1); });
  const now = Date.now();
  nodes = items.map(x => {
    let p = pos.get(x.id);
    if (!p) {
      // 새 점은 엮인 점 근처에서, 없으면 가운데 근처에서 태어나요
      const nb = (x.links || []).map(l => pos.get(l)).find(Boolean);
      p = { x: (nb ? nb.x : 0) + (Math.random() - .5) * 60, y: (nb ? nb.y : 0) + (Math.random() - .5) * 60, vx: 0, vy: 0 };
      pos.set(x.id, p);
    }
    const d = deg.get(x.id) || 0;
    const days = (now - x.createdAt) / 86400000;
    return { id: x.id, it: x, p, r: 5 + Math.sqrt(d) * 3.2, deg: d, fade: Math.max(.35, 1 - days / 240) };

}

function step() {
  const N = nodes.length;
  for (let i = 0; i < N; i++) {
    const a = nodes[i].p;
    for (let j = i + 1; j < N; j++) {
      const b = nodes[j].p;
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || .01;
      if (d2 > 160000) continue;
      const f = 2600 / d2 * alpha, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const e of edges) {
    const a = pos.get(e.a), b = pos.get(e.b); if (!a || !b) continue;
    const L = e.kind === "link" ? 55 : 95, s = e.kind === "link" ? .08 : .03;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || .01;
    const f = (d - L) / d * s * alpha;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const n of nodes) {
    const p = n.p;
    p.vx -= p.x * .006 * alpha; p.vy -= p.y * .006 * alpha;   // 가운데로 살짝
    if (p === dragNode?.p) { p.vx = p.vy = 0; continue; }
    p.vx *= .6; p.vy *= .6; p.x += p.vx; p.y += p.vy;
  }
}

function loop() {
  step(); alpha *= .985; draw();
  raf = alpha > .02 || dragNode ? requestAnimationFrame(loop) : 0;
}
function kick(a = .6) { alpha = Math.max(alpha, a); if (!raf) raf = requestAnimationFrame(loop); }

function mapRefresh(fit) {
  buildGraph();
  $("mapEmpty").classList.toggle("on", items.length < 2);
  if (fit) { alpha = 1; for (let i = 0; i < 400; i++) { step(); alpha *= .99; } fitView(); draw(); kick(.05); }
  else kick(.4);
}

function fitView() {
  if (!nodes.length) { cam = { x: 0, y: 0, k: 1 }; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n => { x0 = Math.min(x0, n.p.x); y0 = Math.min(y0, n.p.y); x1 = Math.max(x1, n.p.x); y1 = Math.max(y1, n.p.y); });
  const k = Math.min(1.6, (W - 110) / Math.max(1, x1 - x0), (H - 110) / Math.max(1, y1 - y0));
  cam = { k, x: W / 2 - (x0 + x1) / 2 * k, y: H / 2 - (y0 + y1) / 2 * k };
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw() {
  if (view !== "map") return;
  const C = { ink: css("--ink"), sub: css("--sub"), acc: css("--accent"), surf: css("--surface") };
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(cam.x, cam.y); ctx.scale(cam.k, cam.k);
  const focus = hoverId || null;
  const near = new Set();
  if (focus) edges.forEach(e => { if (e.a === focus) near.add(e.b); if (e.b === focus) near.add(e.a); });
  for (const e of edges) {
    const a = pos.get(e.a), b = pos.get(e.b); if (!a || !b) continue;
    const on = focus && (e.a === focus || e.b === focus);
    ctx.globalAlpha = focus ? (on ? .9 : .12) : (e.kind === "link" ? .7 : .45);
    ctx.strokeStyle = e.kind === "link" ? C.acc : C.sub;
    ctx.lineWidth = (e.kind === "link" ? 1.8 : 1.1) / Math.sqrt(cam.k);
    ctx.setLineDash(e.kind === "link" ? [] : [4 / cam.k, 4 / cam.k]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes) {
    const dim = focus && n.id !== focus && !near.has(n.id);
    ctx.globalAlpha = dim ? .15 : n.fade;
    ctx.fillStyle = n.deg ? C.acc : C.sub;
    ctx.beginPath(); ctx.arc(n.p.x, n.p.y, n.r, 0, Math.PI * 2); ctx.fill();
    if (n.id === focus) { ctx.globalAlpha = 1; ctx.strokeStyle = C.ink; ctx.lineWidth = 2 / cam.k; ctx.stroke(); }
  }
  // 글씨: 크게 볼 때, 또는 큰 점/선택된 점
  ctx.font = `${12 / cam.k}px ${css("--sans")}`; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const n of nodes) {
    const show = n.id === focus || near.has(n.id) || (!focus && (cam.k > 2 || n.deg >= (nodes.length < 40 ? 2 : 4)));
    if (!show) continue;
    const label = n.it.text.replace(/https?:\/\/\S+/g, "🔗").replace(/\s+/g, " ").slice(0, 14) + (n.it.text.length > 14 ? "…" : "");
    ctx.globalAlpha = n.id === focus ? 1 : .8;
    ctx.lineWidth = 3 / cam.k; ctx.strokeStyle = C.surf; ctx.strokeText(label, n.p.x, n.p.y + n.r + 3 / cam.k);

  }
  ctx.restore(); ctx.globalAlpha = 1;
}

/* 지도 조작: 끌어서 이동, 두 손가락/휠로 확대, 점 끌기, 점 누르면 열기 */
const toWorld = (sx, sy) => ({ x: (sx - cam.x) / cam.k, y: (sy - cam.y) / cam.k });
function hit(sx, sy) {

$("zoomIn").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.3));
$("zoomOut").addEventListener("click", () => zoomAt(W / 2, H / 2, 1 / 1.3));
$("zoomFit").addEventListener("click", () => { fitView(); draw(); });

initStore();
setTimeout(() => input.focus(), 300);
if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
